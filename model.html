<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mt. St. Helens – 3D Timeline</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; width: 100%; height: 100vh; overflow: hidden; }
    model-viewer {
      width: 100%;
      height: 100vh;
      --progress-bar-color: #cc6600;
    }
  </style>
</head>
<body>
  <model-viewer
    src="Line_up_Draco.glb"
    alt="Mt. St. Helens terrain models from USGS 1980s surveys arranged chronologically"
    camera-controls
    auto-rotate
    auto-rotate-delay="3000"
    rotation-per-second="10deg"
    environment-image="neutral"
    shadow-intensity="1"
    exposure="1"
    loading="eager"
    reveal="auto"
    min-field-of-view="1deg"
    max-field-of-view="90deg"
  ></model-viewer>
</body>
</html>
